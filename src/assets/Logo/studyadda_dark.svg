<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 42" width="216" height="42" fill="none">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Vibrant Yellow-Gold Gradient (Brand Signature) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="60%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <!-- Subtle Outer Glow for Lightning -->
    <filter id="glowBolt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Educational Tech Emblem -->
  <g transform="translate(1, 1)">
    <!-- Lower Open Book Pages / Wings -->
    <!-- Left Wing (Cyan) -->
    <path
      d="M 21 23 C 14 26 7 24 2.5 21.5 C 2.5 27.5 7.5 31.5 21 33.5 Z"
      fill="url(#cyanBlueGrad)"
      opacity="0.95"
    />
    <!-- Right Wing (Gold) -->
    <path
      d="M 23 23 C 30 26 37 24 41.5 21.5 C 41.5 27.5 36.5 31.5 23 33.5 Z"
      fill="url(#goldGrad)"
      opacity="0.95"
    />

    <!-- Graduation Cap Top (Mortarboard Diamond) -->
    <!-- Base fill with dark theme slate -->
    <path
      d="M 22 5 L 41 13 L 22 21 L 3 13 Z"
      fill="#020817"
      stroke="url(#cyanBlueGrad)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Subtle Inner Highlight Line on Cap -->
    <path
      d="M 22 6 L 38 13 L 22 20"
      stroke="#38BDF8"
      stroke-width="0.8"
      opacity="0.6"
      fill="none"
    />

    <!-- Cap Skull Base Arch -->
    <path
      d="M 10 16.5 L 10 23 C 10 26.5 34 26.5 34 23 L 34 16.5"
      fill="none"
      stroke="url(#cyanBlueGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Hanging Golden Tassel -->
    <path
      d="M 3 13 L 3 22"
      stroke="#FFD60A"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <circle cx="3" cy="23" r="1.6" fill="#FFD60A" />

    <!-- Center Energy Lightning Bolt / Spark (Knowledge Ignition) -->
    <path
      d="M 23 6 L 17.5 15.5 L 22 15.5 L 20 23 L 26.5 14 L 22 14 Z"
      fill="url(#goldGrad)"
      filter="url(#glowBolt)"
    />
  </g>

  <!-- Typography: "StudyAdda" -->
  <text
    x="48"
    y="28"
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="24.5"
    font-weight="800"
    letter-spacing="-0.5px"
  >
    <tspan fill="#FFFFFF">Study</tspan><tspan fill="url(#goldGrad)">Adda</tspan>
  </text>
</svg>