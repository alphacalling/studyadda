<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 42" width="216" height="42" fill="none">
  <defs>
    <!-- Deep Electric Blue Gradient -->
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Deep Warm Amber/Gold Gradient -->
    <linearGradient id="lightGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Modern Educational Tech Emblem -->
  <g transform="translate(1, 1)">
    <!-- Lower Open Book Pages / Wings -->
    <!-- Left Wing (Blue) -->
    <path
      d="M 21 23 C 14 26 7 24 2.5 21.5 C 2.5 27.5 7.5 31.5 21 33.5 Z"
      fill="url(#lightBlueGrad)"
      opacity="0.95"
    />
    <!-- Right Wing (Amber) -->
    <path
      d="M 23 23 C 30 26 37 24 41.5 21.5 C 41.5 27.5 36.5 31.5 23 33.5 Z"
      fill="url(#lightGoldGrad)"
      opacity="0.95"
    />

    <!-- Graduation Cap Top (Mortarboard Diamond) -->
    <path
      d="M 22 5 L 41 13 L 22 21 L 3 13 Z"
      fill="#F8FAFC"
      stroke="url(#lightBlueGrad)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Cap Skull Base Arch -->
    <path
      d="M 10 16.5 L 10 23 C 10 26.5 34 26.5 34 23 L 34 16.5"
      fill="none"
      stroke="url(#lightBlueGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Hanging Amber Tassel -->
    <path
      d="M 3 13 L 3 22"
      stroke="#D97706"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <circle cx="3" cy="23" r="1.6" fill="#D97706" />

    <!-- Center Energy Lightning Bolt / Spark -->
    <path
      d="M 23 6 L 17.5 15.5 L 22 15.5 L 20 23 L 26.5 14 L 22 14 Z"
      fill="url(#lightGoldGrad)"
    />
  </g>

  <!-- Typography: "StudyAdda" -->
  <!-- "Study" uses paint-order="stroke fill" with a clean white contour so it is clearly visible on dark mode without altering its look in light mode -->
  <text
    x="48"
    y="28"
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="24.5"
    font-weight="800"
    letter-spacing="-0.5px"
  >
    <tspan fill="#000814" stroke="#FFFFFF" stroke-width="2.4" paint-order="stroke fill" stroke-linejoin="round">Study</tspan><tspan fill="url(#lightGoldGrad)">Adda</tspan>
  </text>
</svg>
